<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Review Analyzer — Report Exploration Prototypes</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; scrollbar-gutter: stable; }
    body { min-height: 100%; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, [tabindex]:focus-visible { outline: 2px solid #5478ff; outline-offset: 2px; }
    [hidden] { display: none !important; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .stage { min-height: 100vh; }
    .prototype-note {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      letter-spacing: .05em;
      text-transform: uppercase;
      opacity: .62;
    }
    .prototype-note::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .mono { font-variant-numeric: tabular-nums; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    .muted { opacity: .64; }

    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-chip {
      border: 1px solid currentColor;
      border-color: color-mix(in srgb, currentColor 18%, transparent);
      border-radius: 999px;
      padding: 7px 11px;
      background: transparent;
      color: inherit;
      font-size: 12px;
      transition: transform 140ms ease-out, background 140ms ease-out, color 140ms ease-out;
    }
    .filter-chip:hover { transform: translateY(-1px); }
    .filter-chip:active { transform: scale(.98); }
    .filter-chip[aria-pressed="true"] { background: currentColor; }
    .filter-chip[aria-pressed="true"] > span { color: var(--filter-active-text, white); }

    .entrance { animation: rise-in 220ms var(--ease-out) both; }
    .entrance:nth-child(2) { animation-delay: 35ms; }
    .entrance:nth-child(3) { animation-delay: 70ms; }
    @keyframes rise-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .evidence-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(7, 10, 18, .55);
      backdrop-filter: blur(8px);
    }
    .evidence-dialog {
      width: min(680px, 100%);
      max-height: min(720px, calc(100vh - 48px));
      overflow: auto;
      padding: 26px;
      border-radius: 18px;
      background: #fcfbf8;
      color: #191b22;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .3);
      animation: dialog-in 180ms var(--ease-out) both;
    }
    @keyframes dialog-in { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
    .dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .dialog-close { width: 34px; height: 34px; border: 0; border-radius: 50%; background: #eceae4; color: #272a31; }
    .quote-list { display: grid; gap: 12px; margin-top: 20px; }
    .quote-card { padding: 16px; border: 1px solid #dedbd3; border-radius: 12px; background: #fff; }
    .quote-card blockquote { margin: 0 0 11px; line-height: 1.55; }
    .quote-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; color: #676970; font-size: 12px; }

    /* Research Desk */
    .desk {
      min-height: 100vh;
      padding: 20px 24px 92px;
      color: #17201d;
      background: #edf0eb;
      --filter-active-text: #f7faf7;
    }
    .desk-shell { max-width: 1480px; margin: auto; }
    .desk-topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 18px; }
    .desk-brand { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 760; }
    .desk-mark { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 8px; background: #173c31; color: white; }
    .desk-actions { display: flex; gap: 8px; }
    .desk-action { border: 1px solid #c9d0c8; border-radius: 8px; padding: 8px 11px; background: #f7f8f5; color: #26312d; font-size: 12px; }
    .desk-game {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 16px;
      border: 1px solid #cfd5cd;
      border-radius: 14px;
      background: #f8f9f6;
      box-shadow: 0 1px 0 rgba(25, 50, 41, .04);
    }
    .desk-cover { display: grid; align-content: end; aspect-ratio: 16/9; padding: 10px; border-radius: 9px; color: #fff; background: radial-gradient(circle at 75% 25%, #f7c86d 0 5%, transparent 6%), linear-gradient(145deg, #1f263f 0 50%, #805235 100%); font-family: Georgia, serif; font-size: 17px; }
    .desk-game h1 { margin: 0 0 5px; font-size: clamp(22px, 3vw, 34px); letter-spacing: -.035em; }
    .desk-meta { display: flex; flex-wrap: wrap; gap: 7px 14px; color: #65706b; font-size: 12px; }
    .desk-score { text-align: right; }
    .desk-score strong { display: block; font-size: 25px; }
    .desk-filterbar { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 14px 2px; }
    .desk-scope { font-size: 12px; color: #5d6863; }
    .desk-grid { display: block; }
    .desk-board { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #cdd3cb; border-radius: 14px; overflow: hidden; background: #f8f9f6; }
    .desk-column + .desk-column { border-left: 1px solid #d7dcd5; }
    .desk-column-head { display: flex; align-items: center; justify-content: space-between; padding: 17px 18px 12px; }
    .desk-column-head h2 { margin: 0; font-size: 14px; }
    .desk-total { font-size: 11px; color: #69736e; }
    .desk-theme-wrap { border-top: 1px solid #e1e4df; }
    .desk-theme { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 24px; gap: 10px; align-items: start; padding: 14px 18px; border: 0; background: transparent; color: inherit; text-align: left; }
    .desk-theme:hover, .desk-theme[aria-expanded="true"] { background: #eef3ed; }
    .desk-theme[data-negative]:hover, .desk-theme[data-negative][aria-expanded="true"] { background: #f5eeec; }
    .desk-rank { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: #dce8df; color: #24513f; font-size: 12px; font-weight: 800; }
    [data-negative] .desk-rank { background: #eedfda; color: #773b2e; }
    .desk-theme-title { display: block; margin: 0 0 5px; font-size: 13px; font-weight: 700; line-height: 1.3; }
    .desk-theme-teaser { display: block; color: #68716d; font-size: 11px; line-height: 1.4; }
    .desk-count { color: #52605a; font-size: 11px; font-variant-numeric: tabular-nums; }
    .desk-chevron { display: grid; place-items: center; width: 22px; height: 22px; color: #7a8580; font-size: 13px; transform: rotate(0); transition: transform 180ms ease-out; }
    .desk-theme[aria-expanded="true"] .desk-chevron { transform: rotate(180deg); }
    .desk-theme-detail { padding: 4px 18px 18px 62px; background: #f3f5f1; animation: accordion-in 180ms var(--ease-out) both; }
    .desk-theme-wrap[data-negative] .desk-theme-detail { background: #f7f2ef; }
    .desk-detail-summary { margin: 0 0 14px; color: #53605a; font-size: 12px; line-height: 1.6; }
    .desk-detail-metrics { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .desk-detail-metric { padding: 6px 9px; border: 1px solid #d7ddd5; border-radius: 7px; background: #fbfcfa; color: #53605a; font-size: 10px; }
    .desk-detail-metric strong { margin-right: 4px; color: #25322c; font-size: 12px; }
    .desk-detail-evidence { padding: 13px 14px; border-left: 2px solid #afbbb3; background: rgba(255,255,255,.68); }
    .desk-detail-evidence + .desk-detail-evidence { margin-top: 7px; }
    .desk-detail-evidence blockquote { margin: 0 0 8px; color: #37433d; font-family: Georgia, serif; font-size: 13px; line-height: 1.55; }
    .desk-detail-meta { color: #76817c; font-size: 10px; }
    .desk-detail-all { margin-top: 12px; padding: 8px 11px; border: 1px solid #bfc8c1; border-radius: 7px; background: #fbfcfa; color: #33413a; font-size: 11px; }
    @keyframes accordion-in { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    .history-pop { position: absolute; top: 54px; right: 24px; z-index: 20; width: 250px; padding: 8px; border: 1px solid #cad0c8; border-radius: 12px; background: #fff; color: #25302b; box-shadow: 0 18px 48px rgba(30,45,38,.16); }
    .history-pop button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: transparent; color: inherit; text-align: left; }
    .history-pop button:hover { background: #eef2ec; }

    /* Editorial Brief */
    .brief { min-height: 100vh; padding: 0 0 100px; color: #211f1b; background: #f7f1e7; --filter-active-text: #fffaf0; }
    .brief-header { padding: 20px 6vw; border-bottom: 1px solid #d8cdbb; }
    .brief-nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brief-brand { font-family: Georgia, serif; font-size: 18px; font-weight: 700; }
    .brief-nav-actions { display: flex; align-items: center; gap: 12px; font-size: 12px; }
    .brief-nav button { border: 0; background: transparent; color: inherit; }
    .brief-hero { max-width: 1160px; margin: auto; padding: 64px 32px 42px; }
    .brief-kicker { display: flex; justify-content: space-between; gap: 20px; color: #766e63; font-size: 12px; }
    .brief h1 { max-width: 820px; margin: 18px 0 14px; font-family: Georgia, serif; font-size: clamp(46px, 7.4vw, 96px); font-weight: 500; letter-spacing: -.055em; line-height: .92; }
    .brief-deck { max-width: 710px; margin: 0; color: #625b52; font-family: Georgia, serif; font-size: clamp(17px, 2vw, 22px); line-height: 1.5; }
    .brief-filters { max-width: 1160px; margin: auto; padding: 0 32px 32px; }
    .brief-findings { max-width: 1160px; margin: auto; padding: 0 32px; }
    .brief-section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 0 12px; padding-top: 20px; border-top: 1px solid #cfc2af; }
    .brief-section-head h2 { margin: 0; font-family: Georgia, serif; font-size: 29px; font-weight: 500; }
    .brief-feature { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(260px, .75fr); gap: 48px; padding: 34px 0 44px; }
    .brief-number { color: #a7603c; font-family: Georgia, serif; font-size: 18px; }
    .brief-feature h3 { margin: 14px 0; font-family: Georgia, serif; font-size: clamp(32px, 4vw, 55px); font-weight: 500; letter-spacing: -.035em; line-height: 1.02; }
    .brief-feature p { max-width: 650px; color: #625b52; line-height: 1.65; }
    .brief-stat { align-self: end; padding: 22px 0; border-top: 1px solid #b9aa94; border-bottom: 1px solid #b9aa94; }
    .brief-stat strong { display: block; font-family: Georgia, serif; font-size: 52px; font-weight: 500; }
    .brief-stat span { color: #746b60; font-size: 12px; }
    .brief-evidence-btn { margin-top: 22px; padding: 10px 15px; border: 1px solid #7e7466; border-radius: 99px; background: transparent; color: inherit; }
    .brief-card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #cfc2af; border: 1px solid #cfc2af; }
    .brief-card { min-height: 235px; padding: 24px; border: 0; background: #f7f1e7; color: inherit; text-align: left; }
    .brief-card:hover { background: #fff9ef; }
    .brief-card small { color: #8a7f71; }
    .brief-card h3 { margin: 42px 0 12px; font-family: Georgia, serif; font-size: 23px; font-weight: 500; }
    .brief-card p { color: #6c6459; font-size: 13px; line-height: 1.5; }
    .brief-mixed { display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: center; margin-top: 46px; padding: 28px; background: #272721; color: #f6f0e6; }
    .brief-mixed h3 { margin: 8px 0; font-family: Georgia, serif; font-size: 28px; font-weight: 500; }
    .brief-mixed p { color: #c8c2b8; }
    .brief-donut { display: grid; place-items: center; width: 118px; height: 118px; border-radius: 50%; background: conic-gradient(#89b99b 0 65%, #c67b65 65% 93%, #c8b979 93%); }
    .brief-donut::after { content: "12%\Amentioned"; white-space: pre; display: grid; place-items: center; width: 78px; height: 78px; border-radius: 50%; background: #272721; color: white; font-size: 11px; text-align: center; }

    /* Evidence Canvas */
    .canvas { min-height: 100vh; padding-bottom: 80px; color: #e9edf5; background: #0c1018; --filter-active-text: #0e1522; }
    .canvas-shell { display: grid; grid-template-columns: 72px minmax(360px, .8fr) minmax(420px, 1.2fr); min-height: calc(100vh - 80px); }
    .canvas-rail { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 10px; border-right: 1px solid #242b38; background: #101620; }
    .canvas-logo { display: grid; place-items: center; width: 38px; height: 38px; margin-bottom: 14px; border-radius: 11px; background: #8da7ff; color: #111827; font-weight: 900; }
    .rail-btn { display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #8590a4; }
    .rail-btn:hover, .rail-btn[data-active] { background: #202a3a; color: #f3f6fb; }
    .canvas-list { border-right: 1px solid #242b38; background: #121823; }
    .canvas-list-head { padding: 24px; border-bottom: 1px solid #242b38; }
    .canvas-list-head h1 { margin: 10px 0 5px; font-size: 27px; letter-spacing: -.035em; }
    .canvas-list-head p { margin: 0; color: #8792a5; font-size: 12px; }
    .canvas-filter-row { display: flex; gap: 7px; margin-top: 18px; overflow-x: auto; }
    .canvas .filter-chip { flex: 0 0 auto; color: #b8c2d4; border-color: #313b4d; }
    .canvas-theme-list { padding: 10px; }
    .canvas-theme { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; padding: 15px; border: 0; border-radius: 11px; background: transparent; color: inherit; text-align: left; }
    .canvas-theme:hover { background: #182131; }
    .canvas-theme[data-selected] { background: #202b3f; box-shadow: 0 0 0 1px #34415a inset; }
    .canvas-theme h3 { margin: 0 0 6px; font-size: 14px; }
    .canvas-theme p { margin: 0; color: #7f8b9f; font-size: 11px; line-height: 1.4; }
    .canvas-theme-score { color: #9fb2ff; font-size: 12px; font-variant-numeric: tabular-nums; }
    .canvas-inspector { padding: 26px clamp(24px, 4vw, 58px); background: radial-gradient(circle at 90% 5%, rgba(90,115,190,.16), transparent 35%), #0c1018; }
    .canvas-inspector-top { display: flex; justify-content: space-between; gap: 22px; }
    .canvas-badge { display: inline-flex; padding: 5px 8px; border-radius: 6px; background: #223a31; color: #9bd7b8; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .canvas-inspector h2 { max-width: 760px; margin: 15px 0 10px; font-size: clamp(30px, 4vw, 50px); letter-spacing: -.05em; line-height: 1.03; }
    .canvas-summary { max-width: 720px; color: #9aa5b7; font-size: 15px; line-height: 1.65; }
    .canvas-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin: 28px 0; overflow: hidden; border: 1px solid #283143; border-radius: 12px; background: #283143; }
    .canvas-metric { padding: 16px; background: #121823; }
    .canvas-metric strong { display: block; margin-bottom: 5px; font-size: 21px; }
    .canvas-metric span { color: #7f8b9f; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
    .canvas-evidence-head { display: flex; align-items: center; justify-content: space-between; margin: 28px 0 12px; }
    .canvas-evidence-head h3 { margin: 0; font-size: 14px; }
    .canvas-evidence-card { margin-bottom: 10px; padding: 18px; border: 1px solid #283143; border-radius: 12px; background: #111722; }
    .canvas-evidence-card blockquote { margin: 0 0 14px; color: #dce2ed; line-height: 1.6; }
    .canvas-evidence-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; color: #758195; font-size: 11px; }
    .canvas-expand { padding: 8px 11px; border: 1px solid #38445a; border-radius: 8px; background: transparent; color: #cbd4e4; font-size: 11px; }
    .canvas-history { color: #8490a5; font-size: 12px; }

    @media (max-width: 900px) {
      .desk { padding: 14px 14px 92px; }
      .desk-game { grid-template-columns: 82px 1fr; }
      .desk-score { display: none; }
      .brief-hero { padding-top: 44px; }
      .brief-feature { grid-template-columns: 1fr; gap: 10px; }
      .brief-stat { max-width: 280px; }
      .brief-card-grid { grid-template-columns: 1fr; }
      .canvas-shell { grid-template-columns: 58px minmax(300px, .85fr) minmax(380px, 1.15fr); overflow-x: auto; }
    }

    @media (max-width: 640px) {
      .desk-topbar { align-items: flex-start; }
      .desk-brand span:last-child { display: none; }
      .desk-game { grid-template-columns: 1fr; }
      .desk-cover { width: 120px; }
      .desk-filterbar { align-items: flex-start; flex-direction: column; }
      .desk-board { grid-template-columns: 1fr; }
      .desk-column + .desk-column { border-left: 0; border-top: 8px solid #edf0eb; }
      .desk-theme { grid-template-columns: 30px minmax(0, 1fr) auto 22px; padding-inline: 13px; }
      .desk-theme-detail { padding: 4px 13px 16px; }
      .brief-header { padding-inline: 20px; }
      .brief-nav-actions span { display: none; }
      .brief-hero, .brief-filters, .brief-findings { padding-inline: 20px; }
      .brief-kicker { flex-direction: column; gap: 7px; }
      .brief h1 { font-size: 48px; }
      .brief-mixed { grid-template-columns: 1fr; }
      .canvas-shell { display: block; }
      .canvas-rail { position: sticky; top: 0; z-index: 5; flex-direction: row; padding: 8px 12px; border-right: 0; border-bottom: 1px solid #242b38; }
      .canvas-logo { width: 34px; height: 34px; margin: 0 8px 0 0; }
      .rail-btn { width: 36px; height: 36px; }
      .canvas-list { border-right: 0; }
      .canvas-theme-list { display: flex; overflow-x: auto; }
      .canvas-theme { min-width: 275px; }
      .canvas-inspector { padding: 24px 18px 96px; }
      .canvas-metrics { grid-template-columns: 1fr 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .entrance, .evidence-dialog, .desk-theme-detail { animation: none; }
      .filter-chip { transition: none; }
    }

    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }

    /* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }

    .proto-picker-item {
      position: relative; /* sits above the highlight */
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }

    .proto-picker-item:hover {
      color: rgba(255, 255, 255, 0.85);
    }

    .proto-picker-item:active {
      transform: scale(0.97);
    }

    .proto-picker-item:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }

    .proto-picker-item[data-active] {
      color: #fff;
    }

    .proto-picker-divider {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.12);
    }

    .proto-picker-replay {
      padding: 0 10px;
      font-size: 14px;
    }

    .proto-picker[data-position="top"] {
      bottom: auto;
      top: 24px;
    }
  </style>
</head>
<body>
  <main id="stage" class="stage"></main>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Research</button>
    <button class="proto-picker-item">Editorial</button>
    <button class="proto-picker-item">Canvas</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

  <script>
    const quotes = {
      combat: {

    const variants = [deskVariant, briefVariant, canvasVariant];

    document.addEventListener('click', (event) => {
      const filter = event.target.closest('[data-filter]');
      if (filter) {
        const next = filter.getAttribute('aria-pressed') !== 'true';
        filter.setAttribute('aria-pressed', String(next));
        const activeCount = document.querySelectorAll('[data-filter][aria-pressed="true"]').length;
        document.querySelectorAll('[data-scope-label]').forEach((el) => {
          el.textContent = activeCount ? `Filtered evidence · ${Math.max(1842 - (activeCount - 1) * 513, 621).toLocaleString()} reviews · Themes reranked` : 'Quick · Latest 5,000 eligible reviews · Report v4';
        });
      }

      const theme = event.target.closest('[data-theme]');
      if (theme) {
        const data = quotes[theme.dataset.theme];
        if (data) {
          if (theme.closest('.desk')) {
            const wasExpanded = theme.getAttribute('aria-expanded') === 'true';
            document.querySelectorAll('.desk-theme').forEach((el) => {
              el.setAttribute('aria-expanded', 'false');
              el.removeAttribute('data-selected');
            });
            document.querySelectorAll('[data-theme-detail]').forEach((el) => el.setAttribute('hidden', ''));
            if (!wasExpanded) {
              theme.setAttribute('aria-expanded', 'true');
              theme.setAttribute('data-selected', '');
              theme.parentElement.querySelector('[data-theme-detail]')?.removeAttribute('hidden');
            }
          } else {
            document.querySelectorAll('[data-theme]').forEach((el) => el.removeAttribute('data-selected'));
            theme.setAttribute('data-selected', '');
          }
          document.querySelectorAll('[data-detail-title], [data-dialog-title]').forEach((el) => { el.textContent = data.title; });
          document.querySelectorAll('[data-detail-copy], [data-dialog-copy]').forEach((el) => { el.textContent = data.copy; });
          document.querySelectorAll('[data-detail-quote]').forEach((el) => { el.textContent = `“${data.quote}”`; });
          document.querySelectorAll('[data-detail-meta]').forEach((el) => { el.textContent = data.meta; });
          document.querySelectorAll('[data-detail-quote-secondary]').forEach((el) => { el.textContent = `“${data.quote2}”`; });
          document.querySelectorAll('[data-detail-meta-secondary]').forEach((el) => { el.textContent = data.meta2; });
        }
      }

      if (event.target.closest('[data-open-overlay]')) {
        document.querySelector('[data-overlay]')?.removeAttribute('hidden');
        document.querySelector('[data-close-overlay]')?.focus();
      }
      if (event.target.closest('[data-close-overlay]') || event.target.matches('[data-overlay]')) {
        document.querySelector('[data-overlay]')?.setAttribute('hidden', '');
      }
      if (event.target.closest('[data-history]')) {
        const panel = document.querySelector('[data-history-panel]');
        panel?.toggleAttribute('hidden');
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        const overlay = document.querySelector('[data-overlay]');
        if (overlay && !overlay.hasAttribute('hidden')) overlay.setAttribute('hidden', '');
      }

      if (event.key === 'Tab') {
        const modal = document.querySelector('[data-overlay]:not([hidden])');
        if (!modal) return;
        const focusable = [...modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter((el) => !el.disabled);
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });

    // `variants` is an array of render functions, one per variant, in picker order.
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      // Clear first, render next frame, so entrance animations re-run.
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    // Enable the slide only after first paint, so load doesn't animate.
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
